name: CI

on:
  # Manual only: nothing here runs on push, pull request or a schedule, so no minutes are spent
  # unless a maintainer starts the workflow from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Format, lint and unit tests
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest koverXmlReportDebug

      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/kover/reportDebug.xml
            app/build/screenshots
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: securecheck-debug
          path: app/build/outputs/apk/debug/*.apk
