version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: [ "androidx.*" ]
      kotlin:
        patterns: [ "org.jetbrains.kotlin*", "com.google.devtools.ksp*" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
